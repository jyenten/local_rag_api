name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: rag_api_project

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Verify dependency lock consistency
        run: python -B scripts/check_dependency_lock.py

      - name: Install locked dependencies in a clean environment
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -r requirements-linux-py311.lock.txt
          .venv-ci/bin/python -m pip check

      - name: Run tests
        run: .venv-ci/bin/python -m pytest tests -q
